name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install chromium
      - name: Core, native WebView2, and headless frontend checks
        shell: pwsh
        run: ./scripts/verify.ps1 -Native -Frontend
      - name: Package verified executable
        shell: pwsh
        run: ./scripts/package.ps1 -SkipChecks
      - uses: actions/upload-artifact@v4
        with:
          name: Papyrus-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
